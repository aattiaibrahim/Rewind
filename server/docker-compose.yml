# Rewind Server.
#
# On a NAS: uses the published image (ffmpeg included, starts offline once downloaded).
#   CLIPS=/mnt/tank/clips docker compose up -d
#
# Trying it locally from source:
#   node scripts/make-samples.js sample-clips
#   docker compose up --build        # then open http://localhost:8420
services:
  rewind-server:
    image: ghcr.io/aattiaibrahim/rewind-server:latest
    build: .
    container_name: rewind-server
    restart: unless-stopped
    # Who reads the clips. On TrueNAS: your SMB user's uid and the builtin_users group (545),
    # which can read SMB-share datasets. Locally the image default (uid 1000) is fine.
    # user: "3000:545"
    ports:
      - "8420:8420"
    environment:
      TZ: ${TZ:-America/Los_Angeles}
      RESCAN_SECONDS: "60"
      MAX_CACHE_GB: "20"
      TRANSCODE_JOBS: "1"
    volumes:
      # Clips: read-only. The server never writes here.
      - ${CLIPS:-./sample-clips}:/clips:ro
      # Thumbnails and phone versions.
      - rewind-cache:/cache

volumes:
  rewind-cache:
