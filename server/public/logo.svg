<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Flat: a black tile, a white H, and the speed lines and rewind mark in Windows blue. -->
  <rect x="32" y="32" width="960" height="960" rx="224" fill="#0b0b0b"/>
  <!-- Speed streaks trailing off to the left -->
  <g fill="#4cc2ff">
    <rect x="132" y="372" width="196" height="46" rx="23" opacity="0.45"/>
    <rect x="96" y="489" width="230" height="46" rx="23" opacity="0.7"/>
    <rect x="152" y="606" width="168" height="46" rx="23" opacity="0.45"/>
  </g>
  <!-- A bold, forward-leaning H whose crossbar is a rewind mark -->
  <g transform="translate(512 512) skewX(-12) translate(-512 -512)">
    <rect x="356" y="236" width="132" height="552" rx="30" fill="#ffffff"/>
    <rect x="676" y="236" width="132" height="552" rx="30" fill="#ffffff"/>
    <path d="M 676 430 L 676 594 L 590 512 Z M 592 430 L 592 594 L 506 512 Z" fill="#4cc2ff" stroke="#4cc2ff" stroke-width="22" stroke-linejoin="round"/>
  </g>
</svg>
