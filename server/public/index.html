<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e1014">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Rewind Server</title>
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="logo.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <img src="logo.svg" alt="" width="28" height="28">
      <span>Rewind</span>
      <small id="count"></small>
    </div>
    <div class="filters">
      <input id="search" type="search" placeholder="Search clips" autocomplete="off" aria-label="Search clips">
      <select id="game" aria-label="Game">
        <option value="">All games</option>
      </select>
    </div>
  </header>

  <main id="list" aria-live="polite"></main>
  <div id="more" hidden></div>

  <dialog id="player" aria-labelledby="player-title">
    <div class="player-head">
      <div>
        <h2 id="player-title"></h2>
        <p id="player-meta" class="meta"></p>
      </div>
      <button id="close" class="icon" aria-label="Close">&#x2715;</button>
    </div>
    <div class="stage">
      <video id="video" controls playsinline preload="metadata"></video>
      <div id="status" class="status" hidden>
        <p id="status-text"></p>
        <div class="bar"><div id="status-bar"></div></div>
      </div>
    </div>
    <div class="actions">
      <a id="dl-original" class="btn" href="#" download>Download original</a>
      <a id="dl-web" class="btn" href="#" download hidden>Download phone version</a>
      <button id="convert" class="btn ghost" hidden>Make phone version</button>
      <button id="try-original" class="btn ghost" hidden>Play original</button>
    </div>
    <p id="note" class="meta note" hidden></p>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
