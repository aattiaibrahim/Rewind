<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E4FF5C"/>
      <stop offset="1" stop-color="#A6DC1E"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151922"/>
      <stop offset="1" stop-color="#0A0C10"/>
    </linearGradient>
  </defs>
  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#bg)"/>
  <!-- Speed streaks trailing off to the left -->
  <g fill="#C6F432">
    <rect x="132" y="372" width="196" height="46" rx="23" opacity="0.38"/>
    <rect x="96" y="489" width="230" height="46" rx="23" opacity="0.6"/>
    <rect x="152" y="606" width="168" height="46" rx="23" opacity="0.38"/>
  </g>
  <!-- A bold, forward-leaning H whose crossbar is a rewind mark -->
  <g transform="translate(512 512) skewX(-12) translate(-512 -512)">
    <rect x="356" y="236" width="132" height="552" rx="30" fill="url(#lime)"/>
    <rect x="676" y="236" width="132" height="552" rx="30" fill="url(#lime)"/>
    <path d="M 676 430 L 676 594 L 590 512 Z M 592 430 L 592 594 L 506 512 Z" fill="url(#lime)" stroke="url(#lime)" stroke-width="22" stroke-linejoin="round"/>
  </g>
</svg>
